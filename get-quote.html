<body>
  <div id="root" data-server-rendered="true">
    <div role="region" aria-label="Notifications (F8)" tabindex="-1">

        class="fixed top-0 z-[100] flex max-h-screen w-full flex-col-reverse p-4 sm:bottom-0 sm:right-0 sm:top-auto sm:flex-col md:max-w-[420px]">
      </ol>
    </div>
    <section aria-label="Notifications alt+T" tabindex="-1" aria-live="polite" aria-relevant="additions text"
      aria-atomic="false"></section>
    <div class="min-h-screen flex flex-col">
      <header data-component="header"></header>
      <main class="flex-1">
        <div class="container py-4">
          <nav aria-label="breadcrumb">
            <ol class="flex flex-wrap items-center gap-1.5 break-words text-sm text-muted-foreground sm:gap-2.5">
              <li class="inline-flex items-center gap-1.5"><a class="transition-colors hover:text-foreground"

              <li role="presentation" aria-hidden="true" class="[&amp;>svg]:size-3.5"><svg
                  xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-chevron-right">
                  <path d="m9 18 6-6-6-6"></path>
                </svg></li>
              <li class="inline-flex items-center gap-1.5"><span role="link" aria-disabled="true" aria-current="page"
                  class="font-normal text-foreground">Get a Quote</span></li>
            </ol>
          </nav>
        </div>
        <div class="container py-12">
          <div class="max-w-4xl mx-auto">
            <h1 class="text-4xl font-bold mb-8">Get a Quote — Start Your Condition Discharge or Compliance Submission
            </h1>
            <div class="grid md:grid-cols-3 gap-12">
              <div>
                <section class="mb-8">
                  <h2 class="text-2xl font-semibold mb-4">What You'll Need</h2>
                </section>
                <section class="mb-8">
                  <h2 class="text-2xl font-semibold mb-4">Step 1 — Project Details</h2>
                </section>
                <section class="mb-8">
                  <h2 class="text-2xl font-semibold mb-4">Step 2 — Conditions &amp; Documents</h2>
                </section>
                <section class="mb-8">
                  <h2 class="text-2xl font-semibold mb-4">Step 3 — Timeline &amp; Delivery</h2>
                </section>
                <section>
                  <h2 class="text-2xl font-semibold mb-4">What Happens Next</h2>
                </section>
              </div>
              <div class="md:col-span-2">
                <div class="border bg-card text-card-foreground shadow-sm rounded-2xl">
                  <div class="p-8">
                    <form class="space-y-6" action="https://formsubmit.co/emailwaqas7@gmail.com" method="POST">
                      <input type="hidden" name="_subject" value="New Zevlo quote request">
                      <input type="hidden" name="_template" value="table">
                      <input type="hidden" name="_captcha" value="false">
                      <div class="grid md:grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium mb-2">Your name</label><input
                            name="name" required
                            class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 md:text-sm"
                            placeholder="Full name"></div>
                        <div><label class="block text-sm font-medium mb-2">Email</label><input type="email"
                            name="email" required
                            class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 md:text-sm"
                            placeholder="your@email.com"></div>
                      </div>
                      <div class="grid md:grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium mb-2">Phone</label><input
                          name="phone"
                            class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 md:text-sm"
                            placeholder="Phone number"></div>
                        <div><label class="block text-sm font-medium mb-2">Company</label><input
                          name="company"
                            class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 md:text-sm"
                            placeholder="Company name"></div>
                      </div>
                      <div><label class="block text-sm font-medium mb-2">Project location</label><input
                          name="location"
                          class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 md:text-sm"
                          placeholder="Address or postcode"></div>
                      <div><label class="block text-sm font-medium mb-2">Services required</label>
                        <div class="space-y-2">
                          <div class="flex items-center space-x-2"><input type="checkbox" name="services"
                            value="Planning condition discharge" id="service-planning"
                              class="peer h-4 w-4 shrink-0 rounded-sm border border-primary ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 data-[state=checked]:bg-primary data-[state=checked]:text-primary-foreground"
                            ><label for="service-planning" class="text-sm">Planning condition discharge</label>
                          </div>
                          <div class="flex items-center space-x-2"><input type="checkbox" name="services"
                            value="Building regulations compliance" id="service-building"
                              class="peer h-4 w-4 shrink-0 rounded-sm border border-primary ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 data-[state=checked]:bg-primary data-[state=checked]:text-primary-foreground"
                            ><label for="service-building" class="text-sm">Building regulations compliance</label>
                          </div>
                          <div class="flex items-center space-x-2"><input type="checkbox" name="services"
                            value="Sustainability &amp; corporate compliance" id="service-sustainability"
                              class="peer h-4 w-4 shrink-0 rounded-sm border border-primary ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 data-[state=checked]:bg-primary data-[state=checked]:text-primary-foreground"
                            ><label for="service-sustainability" class="text-sm">Sustainability &amp; corporate
                              compliance</label></div>
                        </div>
                      </div>
                      <div><label class="block text-sm font-medium mb-2">Project details</label><textarea
                          name="details"
                          class="flex min-h-[80px] w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                          placeholder="Tell us about your project, any specific conditions or requirements, and your timeline..."
                          rows="6"></textarea></div><button
                        class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm font-medium ring-offset-background transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 bg-gradient-primary text-primary-foreground hover:shadow-md hover:scale-[1.02] active:scale-[0.98] h-11 rounded-md px-8 w-full"
                        type="submit">Submit Quote Request</button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <footer data-component="footer"></footer>
    </div>
